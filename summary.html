<!DOCTYPE html>
<html lang="th" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพรวมนักเรียนทั้งหมด - สรุปคะแนน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enable class-based dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        sarabun: ['Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./styles/bundle.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="./scripts/summary-loader.js" type="module"></script>
    <link rel="icon" href="./assets/icons/exam.png" type="image/png">
    <script type="module">
        import { auth } from './scripts/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user || !user.email || !user.email.endsWith('@promma.ac.th')) {
                const modal = document.getElementById('access-denied-modal');
                if (modal) {
                    modal.classList.remove('hidden');
                    // Small delay to allow display:block to apply before opacity transition
                    setTimeout(() => {
                        modal.classList.remove('opacity-0');
                        const content = modal.querySelector('.transform');
                        content.classList.remove('scale-95', 'opacity-0');
                        content.classList.add('scale-100', 'opacity-100');
                    }, 10);
                } else {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans">
    <div id="main_header-placeholder"></div>
    <div id="modals-placeholder"></div>

    <!-- Access Denied Modal -->
    <div id="access-denied-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md hidden transition-opacity duration-300 opacity-0">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all duration-300 scale-95 opacity-0 text-center border border-gray-200 dark:border-gray-700">
            <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-100 dark:bg-red-900/30 mb-6 animate-pulse">
                <svg class="h-10 w-10 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-3 font-kanit">จำกัดสิทธิ์การเข้าถึง</h3>
            <p class="text-gray-600 dark:text-gray-300 mb-8 leading-relaxed">
                หน้านี้สำหรับบุคลากรโรงเรียนเท่านั้น<br>กรุณาเข้าสู่ระบบด้วยบัญชี <span class="font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">@promma.ac.th</span>
            </p>
            <a href="index.html" class="inline-flex justify-center w-full px-6 py-3.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white text-base font-bold rounded-xl transition-all shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-0.5">
                กลับสู่หน้าหลัก
            </a>
        </div>
    </div>

    <main class="container mx-auto px-4 pb-8" style="padding-top: var(--header-height-offset, 5rem);">
        <header class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white font-kanit">ภาพรวมคะแนน:
                <br>รายวิชาวิทยาศาสตร์โลกและอวกาศ ม.4
            </h1>
            <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">
                แดชบอร์ดสรุปข้อมูลและสถิติสำคัญของนักเรียนในทุกห้องเรียน</p>
        </header>

        <!-- Container for summary content -->
        <div id="summary-container" class="space-y-8">
            <!-- Summary content will be rendered here by JavaScript -->
            <div id="loading-spinner" class="text-center py-16">
                <svg class="animate-spin h-8 w-8 text-blue-600 dark:text-blue-400 mx-auto"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <p class="mt-4 text-gray-500 dark:text-gray-400">กำลังโหลดข้อมูล...</p>
            </div>
        </div>


    </main>

    <div id="footer-placeholder"></div>
    <script type="module">
        import { Gamification } from './scripts/gamification.js';
        new Gamification();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="th">

<title>Pixel Art Cat</title>
<style>
    body {
        background-color: #2c2f33; /* พื้นหลังสีเทาเข้มเพื่อให้เห็นแมวชัด */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* ตัวแปรสี แก้ไขสีแมวได้ที่นี่ */
    :root {
        --pixel-size: 20px; /* ขนาดของพิกเซล (ปรับให้ใหญ่/เล็กที่นี่) */
        
        /* สีต่างๆ */
        --c-trans: transparent;     /* โปร่งใส */
        --c-outline: #111111;       /* สีเส้นขอบ (ดำ) */
        --c-fur: #A07F5E;           /* สีขนหลัก (น้ำตาลอ่อน) */
        --c-shadow: #6D523C;        /* สีเงา/ลาย (น้ำตาลเข้ม) */
    }

    .pixel-art {
        display: grid;
        /* กำหนดจำนวนคอลัมน์ (กว้าง 17 ช่อง) */
        grid-template-columns: repeat(17, var(--pixel-size));
        /* กำหนดจำนวนแถว (สูง 10 ช่อง) */
        grid-template-rows: repeat(10, var(--pixel-size));
    }

    .pixel {
        width: 100%;
        height: 100%;
    }

    /* คลาสสำหรับสีแต่ละสี */
    ._ { background-color: var(--c-trans); }
    .b { background-color: var(--c-outline); }
    .f { background-color: var(--c-fur); }
    .s { background-color: var(--c-shadow); }

</style>
</head>

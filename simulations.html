<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Sarabun:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles/input.css">
  <link rel="icon" href="./assets/icons/exam.png" type="image/png">
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sarabun text-slate-900 dark:text-slate-100 transition-colors duration-300">

  <!-- Sticky Header Placeholder -->
  <div id="main_header-placeholder" class="fixed top-0 left-0 right-0 z-50"></div>

  <main class="container mx-auto px-4 pt-24 pb-12">
    <!-- Breadcrumb & Header -->
    <div class="max-w-4xl mx-auto mb-8">
      <nav class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 mb-4 font-kanit">
        <a href="./index.html" class="hover:text-blue-600 dark:hover:text-blue-400">หน้าแรก</a>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
        <span class="text-slate-900 dark:text-slate-100 font-bold">Simulation</span>
      </nav>
      <h1 class="text-3xl font-bold font-kanit mb-2">คลัง Simulation</h1>
      <p class="text-slate-600 dark:text-slate-400">เรียนรู้ผ่านการทดลองเสมือนจริงที่แม่นยำตามหลักวิทยาศาสตร์</p>
    </div>

    <!-- Simulation Grid -->
    <div id="sim-list-container" class="max-w-4xl mx-auto space-y-12">
      <!-- Physics M.4 Section -->
      <section>
        <div class="flex items-center gap-3 mb-6">
          <div
            class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
          </div>
          <h2 class="text-xl font-bold font-kanit uppercase tracking-wide">ฟิสิกส์ ม.4</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Chapter 2: Combined Motion Tile -->
          <a href="simulation-viewer.html?id=m4-ch2"
            class="group p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md hover:border-blue-300 dark:hover:border-blue-700 transition-all flex items-center gap-4">
            <div
              class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform overflow-hidden font-kanit font-bold text-xl text-blue-500">
              2
            </div>
            <div class="flex-grow min-w-0">
              <h3 class="font-bold text-slate-900 dark:text-white truncate">บทที่ 2: การเคลื่อนที่</h3>
              <p class="text-xs text-slate-500 dark:text-slate-500 mt-1">แนวตรง, แนวดิ่ง, กราฟ และสูตรคำนวณ</p>
              <div class="mt-2 flex items-center gap-1.5">
                <span
                  class="px-2 py-0.5 rounded-full bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 text-[10px] font-bold">พร้อมใช้งาน</span>
                <span class="text-[10px] text-slate-400">6 ภารกิจ (2 โหมด)</span>
              </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-slate-300 group-hover:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </a>

          <!-- Chapter 7 Tile (Disabled) -->
          <div
            class="p-5 rounded-2xl bg-slate-50/50 dark:bg-slate-900/50 border border-dashed border-slate-200 dark:border-slate-800 flex items-center gap-4 opacity-50 grayscale">
            <div class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0">
              <span class="text-slate-400 font-bold text-xl">7</span>
            </div>
            <div class="flex-grow min-w-0">
              <h3 class="font-bold text-slate-400">บทที่ 7: การเคลื่อนที่แนวโค้ง</h3>
              <p class="text-xs text-slate-400 mt-1">เร็ว ๆ นี้</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <script src="./scripts/app-loader.js" type="module"></script>
</body>

</html>

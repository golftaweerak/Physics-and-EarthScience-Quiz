<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Viewer | แบบฝึกหัดฟิสิกส์ & วิทย์โลก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles/input.css">
  <link rel="icon" href="./assets/icons/exam.png" type="image/png">

  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 flex flex-col min-h-screen font-sarabun text-slate-900 dark:text-slate-100">

  <!-- Sticky Header Placeholder -->
  <div id="main_header-placeholder" class="fixed top-0 left-0 right-0 z-50"></div>

  <div class="container mx-auto px-4 pt-20 pb-12 flex-grow flex flex-col">
    <!-- Navigation Back Link -->
    <div class="max-w-7xl mx-auto w-full mb-4 flex items-center justify-between font-kanit">
      <a href="./simulations.html"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:border-blue-300 transition-all shadow-xs group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>กลับคลัง Simulation</span>
      </a>
    </div>

    <!-- Main Simulation Container -->
    <main id="sim-container"
      class="flex-grow bg-white dark:bg-slate-900/50 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden p-4 md:p-8 relative">
      <!-- Loading State -->
      <div id="sim-loading" class="flex flex-col items-center justify-center h-full min-h-[50vh] gap-4">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="font-kanit font-bold text-slate-500">กำลังโหลด Simulation...</p>
      </div>
    </main>
  </div>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <!-- app-loader will handle initial setup -->
  <script src="./scripts/app-loader.js" type="module"></script>

  <!-- Simulation Dispatcher Logic -->
  <script type="module">
    import { SimulationLoader } from './scripts/simulation-loader.js';

    async function loadSimulation() {
      const urlParams = new URLSearchParams(window.location.search);
      const simId = urlParams.get('id');
      const container = document.getElementById('sim-container');

      if (!simId) {
        container.innerHTML = `
          <div class="p-8 text-center flex flex-col items-center justify-center min-h-[40vh] gap-3">
            <div class="text-5xl mb-2">🔎</div>
            <h3 class="text-xl font-bold font-kanit text-slate-800 dark:text-slate-200">ไม่พบรหัส Simulation</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400">กรุณาเลือกบทเรียนจากคลัง Simulation</p>
            <a href="./simulations.html" class="mt-2 inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-bold font-kanit text-sm shadow-md transition-all">
              ไปยังคลัง Simulation
            </a>
          </div>`;
        return;
      }

      try {
        const SimulationModule = await SimulationLoader.load(simId);
        const sim = new SimulationModule({ containerId: 'sim-container' });
        await sim.init();
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="p-8 text-center flex flex-col items-center justify-center min-h-[40vh] gap-3">
            <div class="text-5xl mb-2">🛠️</div>
            <h3 class="text-xl font-bold font-kanit text-slate-800 dark:text-slate-200">ไม่สามารถโหลด Simulation ได้</h3>
            <p class="text-sm text-red-500 font-medium max-w-md">${err.message}</p>
            <a href="./simulations.html" class="mt-4 inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold font-kanit text-sm transition-all">
              กลับไปที่คลัง Simulation
            </a>
          </div>`;
      }
    }

    window.addEventListener('load', loadSimulation);
  </script>
</body>

</html>

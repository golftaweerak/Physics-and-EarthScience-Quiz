# .github/workflows/update-scores.yml
name: Update Scores Data

on:
  # ตั้งเวลาให้ทำงานทุกๆ ชั่วโมง (ใช้ синтаксис cron)
  schedule:
    - cron: '0 * * * *'
  # อนุญาตให้รัน workflow นี้ได้เองจากหน้า Actions ใน GitHub
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout โค้ดจาก repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ตั้งค่า Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. ติดตั้ง dependencies (ในที่นี้คือ xlsx)
      - name: Install dependencies
        run: npm install xlsx

      # 4. รันสคริปต์เพื่อดาวน์โหลดและแปลงไฟล์ของเทอม 2/2568
      - name: Run fetch and convert script for Term 2/2568
        run: node tools/fetch-term2.js

      # 5. รันสคริปต์เพื่อดาวน์โหลดและแปลงไฟล์ของเทอม 1/2569
      - name: Run fetch and convert script for Term 1/2569
        run: node tools/fetch-term1-2569.js

      # 6. Commit และ Push ไฟล์ที่อัปเดตแล้วกลับเข้า repository
      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          # ตรวจสอบว่ามีไฟล์ที่เปลี่ยนแปลงหรือไม่ก่อน commit
          git diff --staged --quiet || (git commit -m "Update scores data from workflow" && git push)

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Cat Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #2c3e50;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .canvas-container {
            position: relative;
            width: 384px; /* Zoomed in */
            height: 384px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #B3E5FC; /* Softer pastel blue bg */
            border-radius: 12px;
            border: 6px solid #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .btn {
            font-family: 'Kanit', sans-serif;
            transition: all 0.1s;
            transform: translateY(0);
            border-bottom: 4px solid #b0bec5;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid #b0bec5;
        }
        .btn.active {
            background-color: #FFB74D;
            color: white;
            border-color: #F57C00;
        }
        
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
    </style>
</head>
<body class="flex flex-col h-screen items-center justify-center text-white">

    <div class="absolute top-4 left-4 z-20">
        <a href="./profile.html" class="inline-flex items-center gap-2 px-4 py-2 bg-white/20 hover:bg-white/40 text-white rounded-lg transition-colors text-sm font-bold backdrop-blur-sm shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            กลับหน้าโปรไฟล์
        </a>
    </div>

    <div class="absolute top-6 text-center z-10">
        <h1 class="text-2xl md:text-3xl font-bold mb-2 text-yellow-300 pixel-font" style="text-shadow: 2px 2px #444;">SUPER CUTE CAT</h1>
        <p class="text-gray-200 text-sm opacity-90">ตากลม หางฟู ปาก W (Chibi V2)</p>
    </div>

    <div class="canvas-container">
        <!-- Render resolution 96x96 for chunky pixels -->
        <canvas id="gameCanvas" width="96" height="96"></canvas>
    </div>

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-xl shadow-xl w-11/12 max-w-2xl z-20 mt-8 border border-white/20">
        
        <div class="flex items-center justify-center mb-6">
             <button id="btn-random" class="btn bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg flex items-center gap-2 text-lg border-purple-700 shadow-lg">
                🎲 เปิดโหมดซุกซน (Auto)
            </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
            <button class="btn active bg-gray-100 text-gray-600 font-bold py-2 px-2 rounded" data-mood="normal">😺 ปกติ</button>
            <button class="btn bg-gray-100 text-gray-600 font-bold py-2 px-2 rounded" data-mood="happy">🥰 ดีใจ</button>
            <button class="btn bg-gray-100 text-gray-600 font-bold py-2 px-2 rounded" data-mood="shock">🙀 ตกใจ</button>
            <button class="btn bg-gray-100 text-gray-600 font-bold py-2 px-2 rounded" data-mood="sleep">😴 ง่วง</button>
            <button class="btn bg-gray-100 text-gray-600 font-bold py-2 px-2 rounded" data-mood="work">💻 ขยัน</button>
        </div>
        
        <div class="mt-4 text-center text-xs text-gray-200 font-mono">
            STATUS: <span id="status-text" class="text-yellow-300 font-bold">IDLE</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const statusText = document.getElementById('status-text');
            const buttons = document.querySelectorAll('.btn[data-mood]');
            const btnRandom = document.getElementById('btn-random');

            // --- Game State ---
            let currentMood = 'normal';
            let isAutoMode = false;
            let frameCount = 0;
            let mouseX = 0, mouseY = 0;
            let animationFrameId;

            // --- Physics ---
            let catX = 32; 
            let catY = 0; 
            let facingRight = true;
            let walkSpeed = 0.5;
            let targetX = 32;
            let jumpVelocity = 0;
            
            let autoTimer = 0; 
            let nextActionTime = 60;

            // --- Cute Palette ---
            const C = {
                outline: '#5D4037', // Brown outline
                main: '#FFB74D',    // Nice Orange
                shadow: '#F57C00',  // Darker Orange
                light: '#FFE0B2',   // Light Orange
                white: '#FFFFFF',   // Pure White for max cuteness
                whiteShadow: '#F0F4C3',
                nose: '#FF8A80',    // Pink
                cheek: '#F48FB1',   // Blush
                eye: '#212121'      // Soft Black
            };

            // --- Control ---
            function setMood(mood) {
                currentMood = mood;
                if (!isAutoMode) {
                    catX = 32;
                    catY = 0;
                    facingRight = true;
                }
                updateUI();
            }

            function toggleAutoMode() {
                isAutoMode = !isAutoMode;
                if (isAutoMode) {
                    btnRandom.classList.add('bg-green-500', 'border-green-700');
                    btnRandom.classList.remove('bg-purple-500', 'border-purple-700');
                    btnRandom.innerHTML = "🛑 หยุดซุกซน";
                    statusText.innerText = "AUTO MODE: DECIDING...";
                } else {
                    btnRandom.classList.add('bg-purple-500', 'border-purple-700');
                    btnRandom.classList.remove('bg-green-500', 'border-green-700');
                    btnRandom.innerHTML = "🎲 เปิดโหมดซุกซน (Auto)";
                    setMood('normal');
                }
            }

            function updateUI() {
                buttons.forEach(btn => {
                    if(btn.dataset.mood === currentMood && !isAutoMode) {
                        btn.classList.add('active');
                        btn.classList.remove('bg-gray-100', 'text-gray-600');
                    } else {
                        btn.classList.remove('active');
                        btn.classList.add('bg-gray-100', 'text-gray-600');
                    }
                });
                
                let text = currentMood.toUpperCase();
                if (isAutoMode) text = `AUTO: ${text}`;
                statusText.innerText = text;
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if(isAutoMode) toggleAutoMode();
                    setMood(btn.dataset.mood);
                });
            });

            btnRandom.addEventListener('click', toggleAutoMode);

            document.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = Math.floor((e.clientX - rect.left) / (rect.width / 96));
                mouseY = Math.floor((e.clientY - rect.top) / (rect.height / 96));
            });

            function think() {
                autoTimer++;
                if (autoTimer > nextActionTime) {
                    autoTimer = 0;
                    nextActionTime = Math.random() * 120 + 60;

                    const actions = ['normal', 'walk', 'walk', 'jump', 'sleep', 'happy'];
                    const choice = actions[Math.floor(Math.random() * actions.length)];
                    currentMood = choice;

                    if (choice === 'walk') {
                        targetX = Math.floor(Math.random() * 60) + 10; 
                        facingRight = targetX > catX;
                        statusText.innerText = "AUTO: WALKING...";
                    } else if (choice === 'jump') {
                        jumpVelocity = -4;
                        statusText.innerText = "AUTO: JUMP!";
                    } else if (choice === 'sleep') {
                        nextActionTime = 180;
                        statusText.innerText = "AUTO: Zzz...";
                    }
                }
            }

            function drawRect(x, y, w, h, color) {
                ctx.fillStyle = color;
                ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
            }

            // --- Update Loop ---
            function update() {
                frameCount++;
                ctx.clearRect(0, 0, 96, 96); // 96x96 canvas

                if (isAutoMode) {
                    think();
                    if (currentMood === 'walk') {
                        if (Math.abs(catX - targetX) > 1) {
                            catX += (targetX > catX) ? walkSpeed : -walkSpeed;
                            facingRight = (targetX > catX);
                            catY = Math.sin(frameCount * 0.4) * 1.5; 
                        } else {
                            currentMood = 'normal';
                            catY = 0;
                        }
                    }
                    if (currentMood === 'jump') {
                        catY += jumpVelocity;
                        jumpVelocity += 0.25;
                        if (catY >= 0) {
                            catY = 0;
                            jumpVelocity = 0;
                            currentMood = 'normal';
                        }
                    }
                } else {
                    if (currentMood === 'happy') {
                        if (frameCount % 20 < 10) catY = -2; else catY = 0;
                    } else {
                        catY = 0;
                    }
                }

                let drawX = catX;
                let drawY = catY + 15; 

                if (currentMood === 'shock') {
                    drawX += (Math.random() - 0.5) * 2;
                    drawY += (Math.random() - 0.5) * 2;
                }
                if (currentMood === 'sleep') {
                    drawY += Math.sin(frameCount * 0.05) * 1; 
                }

                if (currentMood === 'walk') {
                    drawSideView(ctx, drawX, drawY, facingRight, frameCount);
                } else {
                    drawFrontView(ctx, drawX, drawY, facingRight, frameCount, mouseX, mouseY);
                }

                if (currentMood === 'sleep') {
                    ctx.fillStyle = '#fff';
                    let zStep = Math.floor(frameCount / 25) % 4;
                    if (zStep > 0) drawPixelText("Z", drawX + (facingRight?35:-5), 25);
                    if (zStep > 1) drawPixelText("Z", drawX + (facingRight?42:2), 18);
                }

                animationFrameId = requestAnimationFrame(update);
            }

            // --- FRONT VIEW (CHIBI V2) ---
            function drawFrontView(ctx, x, y, facingRight, frame, mx, my) {
                ctx.save();
                
                // Mirror logic
                if (!facingRight) {
                    ctx.translate(x + 16, 0); // approx center
                    ctx.scale(-1, 1);
                    ctx.translate(-(x + 16), 0);
                }

                // 1. Tail (Wagging & BIGGER)
                let tailWag = Math.sin(frame * 0.1) * 4;
                if (currentMood === 'happy') tailWag *= 2;
                
                // Tail Outline for visibility
                drawRect(x + 23 + tailWag, y + 20, 8, 20, C.outline); 
                // Tail Color
                drawRect(x + 24 + tailWag, y + 21, 6, 18, C.main); 
                // Tail Tip
                drawRect(x + 24 + tailWag, y + 18, 6, 6, C.white); 

                // 2. Body (Small blob)
                // Body with rounded shoulders
                drawRect(x + 2, y + 37, 28, 16, C.main); // Main body
                drawRect(x + 4, y + 35, 24, 20, C.main); // Vertical part to round it
                // Belly
                drawRect(x + 8, y + 40, 16, 12, C.white);
                
                // 3. Paws
                drawRect(x + 6, y + 51, 6, 6, C.outline);
                drawRect(x + 20, y + 51, 6, 6, C.outline);
                drawRect(x + 7, y + 52, 4, 4, C.white);
                drawRect(x + 21, y + 52, 4, 4, C.white);

                // Work Mode Laptop
                if (currentMood === 'work' && !isAutoMode) {
                    drawRect(x - 8, y + 56, 48, 4, '#546E7A'); // Base
                    drawRect(x - 2, y + 42, 36, 16, '#263238'); // Screen
                    drawRect(x + 2, y + 45, 28, 10, '#29B6F6'); // Display
                }

                // 4. Head (Big & Wide)
                let hx = x - 4; 
                let hy = y + 5;
                let hw = 40;
                let hh = 32;

                // Ears (More Triangular)
                // Left Ear
                drawRect(hx + 6, hy - 8, 2, 2, C.outline); // Tip
                drawRect(hx + 4, hy - 6, 6, 8, C.main);
                drawRect(hx + 2, hy - 4, 10, 6, C.main);
                // Right Ear
                drawRect(hx + 32, hy - 8, 2, 2, C.outline);
                drawRect(hx + 30, hy - 6, 6, 8, C.main);
                drawRect(hx + 28, hy - 4, 10, 6, C.main);

                // Face Shape (Rounded corners)
                drawRect(hx + 2, hy, hw - 4, hh, C.main); // Vertical part
                drawRect(hx, hy + 2, hw, hh - 4, C.main); // Horizontal part
                // Fill corners
                drawRect(hx + 1, hy + 1, hw - 2, hh - 2, C.main);

                // Stripes (Top head)
                drawRect(hx + 18, hy, 4, 6, C.shadow);
                drawRect(hx + 12, hy, 2, 4, C.shadow);
                drawRect(hx + 26, hy, 2, 4, C.shadow);

                // Cheeks
                drawRect(hx + 4, hy + 22, 4, 4, C.cheek);
                drawRect(hx + 32, hy + 22, 4, 4, C.cheek);

                // Whiskers
                drawRect(hx - 3, hy + 21, 5, 1, C.outline);
                drawRect(hx - 3, hy + 24, 5, 1, C.outline);
                drawRect(hx + 38, hy + 21, 5, 1, C.outline);
                drawRect(hx + 38, hy + 24, 5, 1, C.outline);

                // Eyes (ROUNDER & BIGGER)
                let ex = hx + 8;
                let ey = hy + 12;
                let spacing = 16; 

                if (currentMood === 'sleep') {
                    drawRect(ex, ey + 4, 6, 2, C.outline);
                    drawRect(ex + spacing, ey + 4, 6, 2, C.outline);
                } else if (currentMood === 'happy') {
                    drawRect(ex, ey + 2, 6, 2, C.outline);
                    drawRect(ex + 2, ey, 2, 2, C.outline);
                    drawRect(ex + spacing, ey + 2, 6, 2, C.outline);
                    drawRect(ex + spacing + 2, ey, 2, 2, C.outline);
                } else if (currentMood === 'shock') {
                    drawRect(ex, ey, 6, 6, '#FFF');
                    drawRect(ex + spacing, ey, 6, 6, '#FFF');
                    drawRect(ex + 2, ey + 2, 2, 2, '#000');
                    drawRect(ex + spacing + 2, ey + 2, 2, 2, '#000');
                } else {
                    // ** NEW ROUND EYES **
                    // Left Eye
                    drawRect(ex + 1, ey, 4, 8, C.eye); // Vertical center
                    drawRect(ex, ey + 1, 6, 6, C.eye); // Horizontal center
                    // Left Sparkle (Bigger)
                    drawRect(ex + 3, ey + 1, 2, 2, '#FFF');

                    // Right Eye
                    drawRect(ex + spacing + 1, ey, 4, 8, C.eye);
                    drawRect(ex + spacing, ey + 1, 6, 6, C.eye);
                    // Right Sparkle
                    drawRect(ex + spacing + 3, ey + 1, 2, 2, '#FFF');
                }

                // Nose
                drawRect(hx + 19, hy + 23, 2, 2, C.nose);
                
                // ** NEW W MOUTH **
                if (currentMood !== 'shock') {
                    // Left curve of w
                    drawRect(hx + 17, hy + 26, 1, 1, C.outline);
                    drawRect(hx + 18, hy + 27, 1, 1, C.outline);
                    // Middle peak
                    drawRect(hx + 19, hy + 26, 2, 1, C.outline);
                    // Right curve of w
                    drawRect(hx + 21, hy + 27, 1, 1, C.outline);
                    drawRect(hx + 22, hy + 26, 1, 1, C.outline);
                } else {
                     // Mouth 'o' for shock
                     drawRect(hx + 18, hy + 25, 4, 4, '#000'); 
                }

                ctx.restore();
            }

            // --- SIDE VIEW (CHIBI WALK) ---
            function drawSideView(ctx, x, y, facingRight, frame) {
                ctx.save();
                
                if (!facingRight) {
                    ctx.translate(x + 16, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-(x + 16), 0);
                }

                let legOffset = Math.sin(frame * 0.4) * 4;

                // 1. Tail (Back - BIG & CLEAR)
                let tailWag = Math.sin(frame * 0.3) * 2;
                // Outline
                drawRect(x - 8, y + 20 + tailWag, 8, 12, C.outline);
                // Fill
                drawRect(x - 7, y + 21 + tailWag, 6, 10, C.main);
                // Tip
                drawRect(x - 7, y + 18 + tailWag, 6, 6, C.white); 

                // 2. Far Legs (Darker)
                drawRect(x + 8 + legOffset, y + 50, 6, 6, C.shadow);
                drawRect(x + 22 - legOffset, y + 50, 6, 6, C.shadow);

                // 3. Body (Side)
                drawRect(x + 2, y + 36, 30, 18, C.main);
                drawRect(x + 6, y + 46, 20, 6, C.white); // Belly

                // 4. Near Legs
                drawRect(x + 8 - legOffset, y + 50, 6, 6, C.main);
                drawRect(x + 22 + legOffset, y + 50, 6, 6, C.main);
                // Socks
                drawRect(x + 8 - legOffset, y + 54, 6, 2, C.white);
                drawRect(x + 22 + legOffset, y + 54, 6, 2, C.white);

                // 5. Head (Profile)
                let hx = x + 20;
                let hy = y + 8;
                
                // Ear
                drawRect(hx + 8, hy - 6, 8, 8, C.main);
                drawRect(hx + 10, hy - 4, 4, 4, C.cheek);

                // Face Shape
                drawRect(hx, hy, 24, 28, C.main);
                // Muzzle
                drawRect(hx + 18, hy + 18, 8, 8, C.white);
                drawRect(hx + 24, hy + 19, 2, 2, C.nose);

                // Eye (Side - Rounder)
                drawRect(hx + 11, hy + 10, 4, 8, C.eye);
                drawRect(hx + 10, hy + 11, 6, 6, C.eye);
                drawRect(hx + 13, hy + 11, 2, 2, '#FFF'); // Sparkle

                ctx.restore();
            }

            function drawPixelText(char, x, y) {
                if (char === "Z") {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x, y, 6, 2);
                    ctx.fillRect(x+4, y+2, 2, 2);
                    ctx.fillRect(x+2, y+4, 2, 2);
                    ctx.fillRect(x, y+6, 6, 2);
                }
            }

            if (window.catAnimFrameId) cancelAnimationFrame(window.catAnimFrameId);
            update();
            window.catAnimFrameId = animationFrameId;
            
        })();
    </script>
</body>
</html>

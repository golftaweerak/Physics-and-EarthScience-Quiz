<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบความถูกต้องของชุดข้อสอบ (Quiz Validator)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; padding: 40px; background-color: #f3f4f6; color: #1f2937; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
        .status { margin-bottom: 20px; font-weight: bold; }
        .status.loading { color: #2563eb; }
        .status.success { color: #059669; }
        .status.error { color: #dc2626; }
        
        .log-item { padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 0.9rem; }
        .log-item.error { background-color: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .log-item strong { font-weight: bold; display: block; margin-bottom: 4px; }
        .log-item span { display: block; color: #666; font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ตรวจสอบความถูกต้องของข้อมูล (Quiz Data Validator)</h1>
        <div id="status" class="status loading">กำลังโหลดและตรวจสอบข้อมูล...</div>
        <div id="results"></div>
    </div>

    <script type="module">
        // นำเข้ารายการข้อสอบหลัก
        import { quizList } from '../data/quizzes-list.js';

        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');
        let errorCount = 0;

        async function validate() {
            let processed = 0;
            for (const quiz of quizList) {
                processed++;
                // อัปเดตสถานะให้ผู้ใช้เห็นความคืบหน้า
                statusDiv.textContent = `กำลังตรวจสอบ... (${processed}/${quizList.length}): ${quiz.id}`;
                await new Promise(resolve => setTimeout(resolve, 0)); // หยุดรอเล็กน้อยเพื่อให้หน้าจออัปเดตข้อความ

                let path = '';
                // จำลอง Logic การหา Path แบบเดียวกับ data-manager.js
                if (quiz.id.includes('/')) {
                    path = `../data/${quiz.id}-data.js`;
                } else {
                    let folder = "";
                    if (quiz.id.startsWith("phy_m4")) folder = "phy_m4/";
                    else if (quiz.id.startsWith("phy_m5")) folder = "phy_m5/";
                    else if (quiz.id.startsWith("phy_m6")) folder = "phy_m6/";
                    else if (quiz.id.startsWith("ess_basic")) folder = "ess_basic/";
                    else if (quiz.id.startsWith("ess_adv")) folder = "ess_adv/";
                    
                    path = `../data/${folder}${quiz.id}-data.js`;
                }

                try {
                    const module = await import(path);
                    // รองรับทั้ง Default export และ Named export
                    const data = module.default || module.quizData || module.quizItems || module.quizScenarios;
                    
                    if (!Array.isArray(data)) {
                        logError(quiz.id, "Structure Error", "ข้อมูลในไฟล์ไม่ได้อยู่ในรูปแบบ Array");
                        continue;
                    }

                    data.forEach((item, index) => {
                        if (item.type === 'scenario') {
                            if (item.questions && Array.isArray(item.questions)) {
                                item.questions.forEach((q, qIndex) => {
                                    checkQuestion(q, quiz.id, `Scenario ${index + 1} : ข้อย่อยที่ ${qIndex + 1}`);
                                });
                            }
                        } else {
                            checkQuestion(item, quiz.id, `ข้อที่ ${index + 1}`);
                        }
                    });

                } catch (e) {
                    logError(quiz.id, "Load Error", `ไม่สามารถโหลดไฟล์ได้: ${path} (${e.message})`);
                }
            }

            if (errorCount === 0) {
                statusDiv.textContent = "✅ ตรวจสอบเสร็จสิ้น: ไม่พบข้อผิดพลาด";
                statusDiv.className = "status success";
            } else {
                statusDiv.textContent = `❌ ตรวจสอบเสร็จสิ้น: พบข้อผิดพลาด ${errorCount} รายการ`;
                statusDiv.className = "status error";
            }
        }

        function checkQuestion(q, quizId, qLabel) {
            const options = q.options || q.choices;
            // ปรับปรุงการดึงค่าเฉลยให้รองรับค่า 0 (ซึ่งเป็น Falsy value ใน JavaScript)
            let answer = q.answer;
            if (answer === undefined || answer === null) answer = q.correctAnswer;
            if (answer === undefined || answer === null) answer = q.correct;

            // ข้ามการตรวจสอบตัวเลือกสำหรับข้อสอบแบบเติมคำตอบ (fill-in-number)
            if (q.type === 'fill-in-number') {
                if (answer === undefined || answer === null || answer === '') {
                    logError(quizId, qLabel, "ไม่พบเฉลย (answer) สำหรับข้อสอบแบบเติมคำตอบ");
                }
                return;
            }

            if (!options) {
                logError(quizId, qLabel, "ไม่พบตัวเลือก (options/choices)");
                return;
            }

            if (answer === undefined || answer === null || answer === '') {
                logError(quizId, qLabel, "ไม่พบเฉลย (answer)");
                return;
            }

            // ตรวจสอบความถูกต้องของเฉลย
            if (typeof answer === 'number') {
                // กรณีเฉลยเป็น Index (ตัวเลข)
                if (answer < 0 || answer >= options.length) {
                    logError(quizId, qLabel, `เฉลยเป็น Index (${answer}) แต่มีตัวเลือกแค่ ${options.length} ข้อ`);
                }
            } else if (typeof answer === 'string') {
                // กรณีเฉลยเป็น Text หรือ Key (A, B, C, D)
                // ตรวจสอบว่าเฉลยตรงกับข้อความในตัวเลือกหรือไม่
                const match = options.find(opt => opt === answer || opt.startsWith(answer + ".")); // รองรับ "ก." หรือ "ก"
                if (!match) {
                     // ตรวจสอบกรณีเป็น Key A, B, C, D
                    const keyMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, 'E': 4, 'ก': 0, 'ข': 1, 'ค': 2, 'ง': 3, 'จ': 4 };
                    const cleanAns = answer.trim().replace('.', ''); // ตัดจุดออก เช่น "ก." -> "ก"
                    if (keyMap[cleanAns] !== undefined) {
                        if (keyMap[cleanAns] >= options.length) {
                            logError(quizId, qLabel, `เฉลยเป็น Key (${answer}) แต่มีตัวเลือกไม่ถึง`);
                        }
                    } else {
                        logError(quizId, qLabel, `เฉลย "${answer}" ไม่ตรงกับตัวเลือกใดๆ และไม่ใช่ Key มาตรฐาน`);
                    }
                }
            }
        }

        function logError(quizId, context, message) {
            errorCount++;
            const div = document.createElement('div');
            div.className = 'log-item error';
            div.innerHTML = `<strong>${quizId}</strong> <span>ตำแหน่ง: ${context}</span> <span>อาการ: ${message}</span>`;
            resultsDiv.appendChild(div);
        }

        validate();
    </script>
</body>
</html>

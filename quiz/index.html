<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กำลังโหลดแบบทดสอบ...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Sarabun:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
    crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
    crossorigin="anonymous"></script>
  <!-- Shared Styles -->

  <!-- Unified Styles via input.css (Vite processed) -->
  <link rel="stylesheet" href="../styles/input.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <!-- Chart.js for Result Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- MathJS for Scientific Calculator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js" referrerpolicy="no-referrer"></script>
  <link rel="icon" href="../assets/icons/exam.png" type="image/png">

  <style>
    /* Premium Glassmorphic Attributes */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mode-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-card:hover {
      transform: translateY(-4px);
    }

    .mode-card.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1);
    }

    .dark .mode-card.active {
      background: rgba(59, 130, 246, 0.1);
      border-color: #60a5fa;
    }

    .status-bar-item {
      transition: all 0.3s ease;
    }

    .shimmer-glow {
      position: relative;
      overflow: hidden;
    }

    .shimmer-glow::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(255, 255, 255, 0) 100%);
      animation: rotate-shimmer 6s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate-shimmer {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .progress-glow {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>

<body
  class="pt-16 sm:pt-24 bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300 p-3 sm:p-4">
  <div class="max-w-3xl mx-auto">
    <!-- Header with buttons -->
    <div id="main_header-placeholder"></div>

    <main id="quiz-container"
      class="glass-card p-4 sm:p-10 rounded-2xl sm:rounded-[2rem] shadow-2xl relative overflow-hidden">
      <!-- Start Screen -->
      <div id="start-screen" class="max-w-2xl mx-auto py-2 sm:py-4">
        <div class="text-center mb-6 sm:mb-10">
          <h1 id="start-screen-title"
            class="text-2xl sm:text-4xl font-black text-gray-800 dark:text-white mb-3 sm:mb-4 tracking-tight">
            <!-- Title inserted by JS -->
          </h1>
          <p id="start-screen-description"
            class="text-base sm:text-lg text-gray-500 dark:text-gray-400 mb-2 font-medium">
            <!-- Description inserted by JS -->
          </p>
          <div class="w-12 sm:w-16 h-1 sm:h-1.5 bg-blue-500 rounded-full mx-auto mt-4 sm:mt-6 shadow-sm"></div>
        </div>

        <!-- Modern Timer Mode Selection -->
        <div id="timer-options" class="mb-8 sm:mb-10">
          <h2
            class="text-xs sm:text-sm font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em] mb-4 sm:mb-6 text-center">
            เลือกรูปแบบการจับเวลา</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
            <!-- Mode 1: No Timer -->
            <label class="mode-card cursor-pointer group">
              <input type="radio" name="timer-mode" value="none" class="sr-only" checked>
              <div
                class="h-full flex flex-col items-center p-4 sm:p-5 rounded-xl sm:rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-gray-800/40 group-[&:has(input:checked)]:border-blue-500 dark:group-[&:has(input:checked)]:border-blue-400 group-[&:has(input:checked)]:bg-blue-50 group-[&:has(input:checked)]:dark:bg-blue-900/10 transition-all duration-300">
                <span
                  class="text-2xl sm:text-3xl mb-2 sm:mb-3 transform group-hover:scale-110 transition-transform">🎯</span>
                <span class="font-bold text-gray-700 dark:text-gray-200 text-xs sm:text-sm">ไม่จับเวลา</span>
                <span
                  class="text-[9px] sm:text-[10px] text-gray-400 dark:text-gray-500 text-center mt-1 leading-tight">ทำไปเรื่อยๆ<br>ไม่กดดัน</span>
              </div>
            </label>

            <!-- Mode 2: Overall -->
            <label class="mode-card cursor-pointer group">
              <input type="radio" name="timer-mode" value="overall" class="sr-only">
              <div
                class="h-full flex flex-col items-center p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-gray-800/40 group-[&:has(input:checked)]:border-blue-500 dark:group-[&:has(input:checked)]:border-blue-400 group-[&:has(input:checked)]:bg-blue-50 group-[&:has(input:checked)]:dark:bg-blue-900/10 transition-all duration-300">
                <span class="text-3xl mb-3 transform group-hover:scale-110 transition-transform">⏱️</span>
                <span class="font-bold text-gray-700 dark:text-gray-200 text-sm">จับเวลารวม</span>
                <span
                  class="text-[10px] text-gray-400 dark:text-gray-500 text-center mt-1 leading-tight">ท้าทาย<br>มีจำกัดเวลา</span>
              </div>
            </label>

            <!-- Mode 3: Per Question -->
            <label class="mode-card cursor-pointer group">
              <input type="radio" name="timer-mode" value="perQuestion" class="sr-only">
              <div
                class="h-full flex flex-col items-center p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-gray-800/40 group-[&:has(input:checked)]:border-blue-500 dark:group-[&:has(input:checked)]:border-blue-400 group-[&:has(input:checked)]:bg-blue-50 group-[&:has(input:checked)]:dark:bg-blue-900/10 transition-all duration-300">
                <span class="text-3xl mb-3 transform group-hover:scale-110 transition-transform">⚡</span>
                <span class="font-bold text-gray-700 dark:text-gray-200 text-sm">จับเวลาต่อข้อ</span>
                <span
                  class="text-[10px] text-gray-400 dark:text-gray-500 text-center mt-1 leading-tight">รวดเร็ว<br>วัดไหวพริบ</span>
              </div>
            </label>
          </div>
        </div>

        <button id="start-btn"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 px-6 rounded-2xl text-xl shadow-xl shadow-blue-500/20 transition-all duration-300 transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3">
          <span>เริ่มทำแบบทดสอบ</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
        </button>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen" class="hidden">
        <!-- Modern Status Bar -->
        <header id="quiz-status-bar" class="mb-10">
          <div class="flex items-center justify-between gap-4 mb-4">
            <!-- Left: Hearts (Multiplayer) / Score (Single) -->
            <div class="flex items-center gap-3">
              <div id="multiplayer-hearts"
                class="hidden flex items-center gap-1 bg-white/50 dark:bg-gray-800/50 px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700 shadow-sm transition-all duration-300">
                <!-- Real-time hearts injected by JS -->
              </div>
              <div
                class="bg-blue-500/10 dark:bg-blue-400/10 text-blue-600 dark:text-blue-400 px-4 py-1.5 rounded-full text-xs font-black tracking-wider border border-blue-500/20">
                <span id="score-counter">คะแนน: 0</span>
              </div>
            </div>

            <!-- Center: Timer (if active) -->
            <div id="timer-display"
              class="hidden flex items-center gap-2 bg-red-500/10 dark:bg-red-400/10 text-red-600 dark:text-red-400 px-4 py-1.5 rounded-full border border-red-500/20 shadow-sm animate-pulse">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span id="timer-value" class="font-mono font-bold">00:00</span>
            </div>

            <!-- Right: Sound & Menu Toggle -->
            <div class="flex items-center gap-2">
              <button id="sound-toggle-btn"
                class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400 transition-all active:scale-90">
                <!-- Icon inserted by JS -->
              </button>
              <button id="calculator-toggle-btn"
                class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400 transition-all active:scale-90"
                title="เครื่องคิดเลขวิทยาศาสตร์">
                🧮
              </button>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="relative w-full h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden shadow-inner">
            <div id="progress-bar"
              class="absolute inset-y-0 left-0 bg-gradient-to-r from-blue-400 to-indigo-500 transition-all duration-700 ease-out progress-glow"
              style="width: 0%">
              <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
            </div>
            <div id="question-counter"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-black text-white mix-blend-difference opacity-50 uppercase tracking-widest">
            </div>
          </div>
        </header>

        <div class="mb-10 text-center sm:text-left transition-all duration-500">
          <h2 id="quiz-title-display"
            class="text-sm font-black text-blue-500 dark:text-blue-400 uppercase tracking-widest mb-3 opacity-70"></h2>
          <div id="question" class="text-xl sm:text-2xl font-bold leading-relaxed dark:text-white px-2"></div>
        </div>

        <!-- Power-up Bar Placeholder -->
        <div id="power-up-bar" class="flex flex-wrap justify-center gap-3 mb-8 px-2 anim-fade-in">
          <!-- Items injected by logic -->
        </div>

        <div id="hint-area" class="mb-8 hidden anim-fade-in">
          <button id="hint-btn"
            class="w-full sm:w-auto px-6 py-2.5 bg-yellow-400/10 hover:bg-yellow-400/20 border-2 border-yellow-400/30 text-yellow-700 dark:text-yellow-400 font-black rounded-2xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-95">
            💡 แสดงคำใบ้
          </button>
          <div id="hint-text"
            class="hidden mt-4 p-5 bg-yellow-50 dark:bg-yellow-900/10 border-2 border-yellow-200 dark:border-yellow-800/30 text-yellow-800 dark:text-yellow-200 rounded-2xl text-sm font-medium leading-relaxed">
          </div>
        </div>

        <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div id="feedback" class="hidden mt-8 p-6 rounded-[1.5rem] anim-feedback-in shadow-lg border-2"
          aria-live="assertive">
          <div class="feedback-content font-bold"></div>
        </div>
        <div id="action-buttons" class="flex flex-col sm:flex-row items-center justify-between mt-12 gap-4">
          <button id="prev-btn"
            class="hidden w-full sm:w-auto px-8 py-3 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 font-bold rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-all active:scale-95 border border-transparent dark:border-gray-700">
            ข้อก่อนหน้า
          </button>
          <div class="flex-1"></div>
          <button id="skip-btn"
            class="hidden w-full sm:w-auto px-6 py-3 text-gray-500 dark:text-gray-400 font-medium rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-all active:scale-95 border border-dashed border-gray-300 dark:border-gray-600 text-sm sm:text-base">
            <span class="sm:hidden">ข้าม</span>
            <span class="hidden sm:inline">ข้ามข้อนี้</span>
          </button>
          <button id="next-btn"
            class="hidden w-full sm:w-auto px-10 py-4 text-white font-black rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 btn-quiz-next">
            ข้อต่อไป
          </button>
        </div> <!-- End action-buttons -->
      </div> <!-- End quiz-screen -->

      <div id="result-screen" class="hidden text-center">
        <div id="result-content-container"></div>

        <div class="w-full max-w-2xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-4 mt-12">
          <button id="review-btn"
            class="hidden w-full sm:w-auto flex-1 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-black py-4 px-8 rounded-2xl text-lg transition duration-300 shadow-lg hover:shadow-gray-500/10 hover:bg-gray-200 dark:hover:bg-gray-700 active:scale-95">
            ทบทวนข้อที่ผิด
          </button>
          <button id="restart-btn"
            class="w-full sm:w-auto flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 px-8 rounded-2xl text-lg transition duration-300 shadow-xl shadow-blue-500/20 active:scale-95">
            ทำแบบทดสอบอีกครั้ง
          </button>
          <button id="back-to-lobby-btn"
            class="hidden w-full sm:w-auto flex-1 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-black py-4 px-8 rounded-2xl text-lg transition duration-300 shadow-lg border-2 border-indigo-500/20 hover:bg-indigo-500/20 active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            กลับห้องรอ
          </button>
        </div>
      </div>

      <div id="review-screen" class="hidden">
        <h2 class="text-3xl font-black mb-8 text-center dark:text-white uppercase tracking-tight">ทบทวนข้อที่ตอบผิด
        </h2>
        <div id="review-container" class="space-y-6"></div>
        <button id="back-to-result-btn"
          class="w-full mt-12 bg-gray-800 dark:bg-gray-100 text-white dark:text-gray-900 font-black py-4 px-8 rounded-2xl text-xl shadow-xl transition-all transform hover:-translate-y-1 active:scale-95">
          กลับไปหน้าสรุปผล
        </button>
      </div>
    </main>
    <div id="footer-placeholder" class="mt-12"></div>
  </div>

  <!-- Placeholder for all common modals -->
  <div id="modals-placeholder"></div>

  <!-- The single entry point for all quiz page functionality -->
  <script src="../scripts/quiz-page-loader.js" type="module"></script>
</body>

</html>

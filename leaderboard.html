<!-- leaderboard.html -->
<!DOCTYPE html>
<html>
<head>
    <!-- ... (Header, Tailwind, etc.) ... -->
</head>
<body>
    <!-- ... (Navbar) ... -->
    <main class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">กระดานผู้นำ (Leaderboard)</h1>
        <div id="leaderboard-container" class="space-y-4">
            <!-- Loading spinner -->
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
    <script type="module">
        import { db } from './scripts/firebase-init.js';

        const container = document.getElementById('leaderboard-container');

        async function fetchLeaderboard() {
            try {
                const snapshot = await db.collection('leaderboard')
                                         .orderBy('xp', 'desc') // เรียงจาก XP มากไปน้อย
                                         .limit(20)             // แสดงผล 20 อันดับแรก
                                         .get();

                if (snapshot.empty) {
                    container.innerHTML = '<p>ยังไม่มีข้อมูลในกระดานผู้นำ</p>';
                    return;
                }

                let rank = 1;
                container.innerHTML = snapshot.docs.map(doc => {
                    const user = doc.data();
                    return `
                        <div class="flex items-center bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm">
                            <span class="font-bold text-lg w-10">${rank++}</span>
                            <span class="text-3xl w-12">${user.avatar || '🧑‍🎓'}</span>
                            <div class="flex-grow">
                                <p class="font-bold text-gray-800 dark:text-white">${user.name}</p>
                                <p class="text-sm text-gray-500">Level ${user.level}</p>
                            </div>
                            <span class="font-bold text-blue-600 dark:text-blue-400">${user.xp.toLocaleString()} XP</span>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error fetching leaderboard: ", error);
                container.innerHTML = '<p class="text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
            }
        }

        fetchLeaderboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กระดานจัดอันดับ - Physics & Earth Science Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Sarabun:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles/bundle.css">
    <link rel="icon" href="./assets/icons/exam.png" type="image/png">
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sarabun">

    <div id="main_header-placeholder" class="fixed top-0 left-0 w-full z-50"></div>

    <main class="container mx-auto px-4 pb-12 relative z-10" style="padding-top: var(--header-height-offset, 5rem);">
        <div class="max-w-4xl mx-auto">
            <header class="mb-8 pb-4 border-b border-gray-200 dark:border-gray-700">
                <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 font-kanit">กระดานจัดอันดับผู้เล่น</h1>
                <p class="text-md text-gray-600 dark:text-gray-400 mt-1">ดูอันดับผู้เล่นที่มีคะแนนสูงสุดในแต่ละสายวิชา
                </p>
            </header>

            <section
                class="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-800 overflow-hidden">
                <div class="p-4 sm:p-6">
                    <!-- Tabs -->
                    <div class="flex overflow-x-auto pb-2 mb-2 custom-scrollbar-menu gap-2">
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-blue-600 text-white shadow-md"
                            data-type="xp">คะแนนรวม</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="physicsTrackXP">ฟิสิกส์</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="earthTrackXP">วิทย์โลก & ดาราศาสตร์</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnEarthTrackXP">สอวน. วิทย์โลก</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnAstroTrackXP">สอวน. ดาราศาสตร์</button>
                        <!-- Proficiency Tabs -->
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="mechanicsXP">กลศาสตร์</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="electromagnetismXP">ไฟฟ้าและแม่เหล็ก</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="wavesAndOpticsXP">คลื่นและแสง</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="modernPhysicsXP">ฟิสิกส์แผนใหม่</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="matterAndHeatXP">สสารและความร้อน</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="astronomyXP">ดาราศาสตร์</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="geologyXP">ธรณีวิทยา</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="meteorologyXP">อุตุนิยมวิทยา</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="oceanographyXP">สมุทรศาสตร์</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnGeologyXP">ธรณีวิทยา (สอวน.)</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnMeteorologyXP">อุตุฯ (สอวน.)</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnOceanographyXP">สมุทรฯ (สอวน.)</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnAstroJuniorXP">ดารา ม.ต้น</button>
                        <button
                            class="leaderboard-tab whitespace-nowrap py-2 px-4 rounded-full text-sm font-bold transition-all bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600"
                            data-type="posnAstroSeniorXP">ดารา ม.ปลาย</button>
                    </div>
                    <!-- List -->
                    <div id="leaderboard-list-full" class="space-y-2 min-h-[400px]">
                        <!-- Leaderboard rows will be injected here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="./scripts/leaderboard-loader.js" type="module"></script>
    <script type="module">
        import { Gamification } from './scripts/gamification.js';
        new Gamification();
    </script>
</body>

</html>

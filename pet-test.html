<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Pet System Sandbox (Standalone Test)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
  <script type="module" crossorigin src="/Physics-and-EarthScience-Quiz/assets/pet_test-C7bCSQDi.js"></script>
  <link rel="modulepreload" crossorigin href="/Physics-and-EarthScience-Quiz/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/Physics-and-EarthScience-Quiz/assets/bundle-4FX2L4Fd.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 sm:p-8 font-kanit text-gray-800 dark:text-gray-100">
    <div class="max-w-2xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm">
            <a href="./profile.html" class="inline-flex items-center gap-1.5 text-sm font-bold text-gray-600 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                กลับหน้าโปรไฟล์
            </a>
            <span class="px-3 py-1 bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 text-xs font-bold rounded-full border border-amber-300 dark:border-amber-700">
                🧪 Standalone Sandbox Mode
            </span>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-gray-700">
            <h1 class="text-2xl font-black text-center mb-1 bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-300 bg-clip-text text-transparent">
                🐾 2D Pixel Pet Test Sandbox
            </h1>
            <p class="text-xs text-center text-gray-500 dark:text-gray-400 mb-6">
                ระบบจำลองสัตว์เลี้ยงสำหรับสร้างแรงจูงใจในการทำแบบฝึกหัด (ยังไม่เชื่อมกับระบบหลัก)
            </p>

            <!-- Main Pet Interactive Display Area -->
            <div id="pet-display-container" class="relative text-center p-4 bg-gradient-to-b from-blue-50 to-indigo-100/50 dark:from-gray-900 dark:to-gray-800/80 rounded-2xl h-80 cursor-pointer group mb-6 overflow-hidden border border-blue-100 dark:border-gray-700 shadow-inner">
                <canvas id="pet-canvas" class="absolute inset-0 w-full h-full"></canvas>
                
                <!-- Overlay UI on top of Canvas -->
                <div class="relative z-10 flex flex-col justify-between h-full p-2">
                    <div class="flex justify-between items-start">
                        <div class="text-left">
                            <h3 id="pet-display-name" class="text-xl font-black text-gray-900 dark:text-white drop-shadow-md"></h3>
                            <span id="pet-stage-badge" class="inline-block mt-0.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/80 dark:bg-gray-700/80 text-blue-600 dark:text-blue-300 shadow-sm border border-blue-200 dark:border-gray-600">
                                🐣 ร่างไข่
                            </span>
                        </div>
                        <span id="pet-display-level-badge" class="px-3 py-1 bg-blue-600 text-white font-extrabold text-xs rounded-full shadow-md">
                            Lv.1
                        </span>
                    </div>

                    <div class="w-full max-w-xs mx-auto bg-white/80 dark:bg-gray-800/80 p-3 rounded-xl backdrop-blur-sm border border-white/40 dark:border-gray-700 shadow-md">
                        <div class="flex justify-between text-xs font-bold text-gray-700 dark:text-gray-200 mb-1">
                            <span>ความก้าวหน้า XP</span>
                            <span><span id="pet-display-xp">0</span> / <span id="pet-display-next-xp">500</span></span>
                        </div>
                        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden p-0.5 border border-gray-300 dark:border-gray-600">
                            <div id="pet-display-xp-bar" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 text-white text-xs px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-all pointer-events-none shadow-lg backdrop-blur-sm">
                    ✨ คลิกที่สัตว์เลี้ยงเพื่อทักทาย!
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="pet-select" class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">เลือกประเภทสัตว์เลี้ยง:</label>
                        <select id="pet-select" class="block w-full py-2.5 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 font-bold text-sm">
                            <!-- Options populated via JS -->
                        </select>
                    </div>
                    <div>
                        <label for="pet-name-input" class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">ตั้งชื่อเล่นสัตว์เลี้ยง:</label>
                        <div class="flex gap-2">
                            <input type="text" id="pet-name-input" placeholder="ชื่อสัตว์เลี้ยง..." class="flex-grow py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl shadow-sm text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none">
                            <button id="save-name-btn" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-colors shadow-sm">
                                บันทึก
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Interactive Actions -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                    <button id="add-xp-btn" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
                        <span>⚡</span>
                        <span>+150 XP</span>
                    </button>
                    <button id="feed-pet-btn" class="py-2.5 px-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
                        <span>🍖</span>
                        <span>ให้อาหาร</span>
                    </button>
                    <button id="evolve-btn" class="py-2.5 px-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
                        <span>🚀</span>
                        <span>เร่งวิวัฒนาการ</span>
                    </button>
                    <button id="reset-pet-btn" class="py-2.5 px-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
                        <span>🔄</span>
                        <span>รีเซ็ต</span>
                    </button>
                </div>

                <!-- Say Speech Input -->
                <div class="flex gap-2 pt-1">
                    <input type="text" id="speech-input" placeholder="พิมพ์ข้อความให้สัตว์เลี้ยงพูด..." class="flex-grow py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl shadow-sm text-xs font-bold outline-none">
                    <button id="say-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-colors shadow-md">
                        💬 พูด
                    </button>
                </div>
            </div>
        </div>

        <!-- Simulated Profile Card Widget -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border-t-4 border-blue-500 border border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-bold text-center mb-4 text-gray-800 dark:text-gray-100 flex items-center justify-center gap-2">
                <span>📱</span>
                <span>จำลองการแสดงผลบนการ์ดหน้าโปรไฟล์</span>
            </h2>
            
            <div class="flex items-center gap-4 bg-gray-50 dark:bg-gray-900/60 p-4 rounded-2xl border border-gray-200 dark:border-gray-700">
                <!-- Pet Canvas Widget -->
                <div class="w-24 h-24 bg-gradient-to-b from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-700 rounded-2xl relative flex-shrink-0 shadow-inner overflow-hidden border border-gray-200 dark:border-gray-600 cursor-pointer">
                    <canvas id="gamification-pet-canvas" class="absolute inset-0 w-full h-full"></canvas>
                </div>

                <!-- Pet Info Widget -->
                <div class="flex-grow min-w-0">
                    <div class="flex justify-between items-baseline mb-1">
                        <h3 id="gamification-pet-name" class="text-base font-extrabold text-gray-800 dark:text-white truncate"></h3>
                        <span id="gamification-pet-level" class="text-xs font-black text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/50 px-2.5 py-0.5 rounded-full border border-blue-200 dark:border-blue-800"></span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-2 overflow-hidden shadow-inner border border-gray-300 dark:border-gray-600">
                        <div id="gamification-pet-xp-bar" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[11px] mt-1.5 text-gray-500 dark:text-gray-400 font-mono font-bold">
                        <span id="gamification-pet-current-xp"></span>
                        <span id="gamification-pet-next-xp"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
